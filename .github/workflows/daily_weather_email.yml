name: Daily Birchdale Weather Email (early morning Pacific)
on:
  schedule:
    # 09:20 UTC = 2:20am PDT / 1:20am PST. GitHub's cron is best-effort and
    # runs late under load, so aim early and avoid :00, the most congested minute.
    - cron: '20 9 * * *'
  workflow_dispatch:
jobs:
  send-daily-email:
    runs-on: ubuntu-latest

    env:
      OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
      PURPLEAIR_API_KEY: ${{ secrets.PURPLEAIR_API_KEY }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send daily weather email
        run: PYTHONPATH=scripts python scripts/daily_weather_email.py
